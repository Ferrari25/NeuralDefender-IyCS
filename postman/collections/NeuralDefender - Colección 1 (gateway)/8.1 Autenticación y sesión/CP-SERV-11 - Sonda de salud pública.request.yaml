$kind: http-request
name: CP-SERV-11 | Sonda de salud pública
url: "{{url_gateway}}/api/v1/healthz"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-11 | Sonda de salud pública
      // Requisitos: RF-AUT-01, RNF-CONF-05
      // Qué prueba: la sonda de salud responde sin pedir sesión.
      // Petición: GET {{url_gateway}}/api/v1/healthz (sin body ni headers)
      // Esperado: 200 con {"status": "ok", "incidents_file": true o false}
      // ============================================================

      // 1. Código de estado: la sonda es pública y responde 200.
      pm.test("CP-SERV-11 | Código 200", function () {
          pm.response.to.have.status(200);
      });

      const datos = pm.response.json();

      // 2. Contrato: la respuesta trae las dos claves esperadas.
      pm.test("CP-SERV-11 | Contrato: status e incidents_file", function () {
          pm.expect(datos).to.include.all.keys("status", "incidents_file");
      });

      // 3. Tipos: status es texto e incidents_file es verdadero o falso.
      pm.test("CP-SERV-11 | Tipos de datos", function () {
          pm.expect(datos.status).to.be.a("string");
          pm.expect(datos.incidents_file).to.be.a("boolean");
      });

      // 4. Regla de negocio: el servicio informa que está sano.
      pm.test("CP-SERV-11 | status = ok", function () {
          pm.expect(datos.status).to.eql("ok");
      });
    language: text/javascript
  - type: beforeRequest
    code: |-
      // Antes de la primera petición se borran las cookies del gateway,
      // para que la colección siempre empiece sin ninguna sesión abierta.
      const jar = pm.cookies.jar();
      jar.clear(pm.environment.get("url_gateway"), function (error) {
          if (error) { console.log("No se pudieron borrar las cookies: " + error); }
      });
    language: text/javascript
order: 1000
