$kind: http-request
name: CP-SERV-07 | Datos de la sesión activa
url: "{{url_gateway}}/api/v1/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-07 | Datos de la sesión activa
      // Requisito: RF-SUP-05 (el sistema nunca ejecuta acciones)
      // Técnica: partición de equivalencia, partición válida
      // Precondición: sesión del analista abierta en CP-SERV-01
      // Petición: GET /api/v1/me
      // Esperado: 200 con los datos del usuario y
      // puede_ejecutar_acciones = false
      // ============================================================

      // 1. Código: con sesión, 200.
      pm.test("CP-SERV-07 | Código 200", function () {
          pm.response.to.have.status(200);
      });

      const datos = pm.response.json();

      // 2. Contrato de la respuesta.
      pm.test("CP-SERV-07 | Contrato de la respuesta", function () {
          pm.expect(datos).to.include.all.keys("usuario", "rol", "permisos", "puede_ejecutar_acciones", "csrf_token");
      });

      // 3. Tipos de datos.
      pm.test("CP-SERV-07 | Tipos de datos", function () {
          pm.expect(datos.permisos).to.be.an("array");
          pm.expect(datos.puede_ejecutar_acciones).to.be.a("boolean");
      });

      // 4. Regla central del sistema: nadie puede ejecutar acciones de contención.
      pm.test("CP-SERV-07 | Ningún usuario puede ejecutar acciones", function () {
          pm.expect(datos.puede_ejecutar_acciones).to.be.false;
          pm.expect(datos.usuario).to.eql(pm.environment.get("analista"));
      });
    language: text/javascript
order: 9000
