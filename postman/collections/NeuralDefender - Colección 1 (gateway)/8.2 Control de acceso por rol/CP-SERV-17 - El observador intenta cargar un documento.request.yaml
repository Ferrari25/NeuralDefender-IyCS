$kind: http-request
name: CP-SERV-17 | El observador intenta cargar un documento
url: "{{url_gateway}}/api/v1/memoria/documentos"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
body:
  type: json
  content: '{"titulo": "Documento de prueba", "contenido": "Contenido de prueba"}'
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-17 | El observador intenta cargar un documento
      // Requisito: RF-AUT-02, RF-MEM-05 (solo quien decide carga documentos)
      // Técnica: tabla de decisión (rol viewer, operación escribir en memoria)
      // Precondición: sesión de observador
      // Petición: POST /api/v1/memoria/documentos con un documento válido
      // Esperado: 403 con permiso_requerido = "decidir"
      // ============================================================

      // 1. Código: 403.
      pm.test("CP-SERV-17 | Código 403", function () {
          pm.response.to.have.status(403);
      });

      const datos = pm.response.json();

      // 2 y 3. Contrato del error.
      pm.test("CP-SERV-17 | Contrato: error y permiso_requerido", function () {
          pm.expect(datos).to.include.all.keys("error", "permiso_requerido");
      });

      // 4. Regla: escribir en la memoria exige el mismo permiso que decidir.
      pm.test("CP-SERV-17 | Falta el permiso decidir", function () {
          pm.expect(datos.permiso_requerido).to.eql("decidir");
      });
    language: text/javascript
order: 4000
