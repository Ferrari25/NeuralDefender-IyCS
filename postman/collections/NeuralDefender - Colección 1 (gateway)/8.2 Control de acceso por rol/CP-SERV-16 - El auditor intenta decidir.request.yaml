$kind: http-request
name: CP-SERV-16 | El auditor intenta decidir
url: "{{url_gateway}}/api/v1/decision"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
body:
  type: json
  content: '{"incident_id": "{{incident_id}}", "action_id": "{{action_id}}", "decision": "approved"}'
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-16 | El auditor intenta decidir
      // Requisito: RF-AUT-02 (el auditor verifica, pero no decide)
      // Técnica: tabla de decisión (rol auditor, operación decidir)
      // Precondición: sesión de auditor
      // Petición: POST /api/v1/decision con una decisión válida
      // Esperado: 403 con permiso_requerido = "decidir"
      // ============================================================

      // 1. Código: 403.
      pm.test("CP-SERV-16 | Código 403", function () {
          pm.response.to.have.status(403);
      });

      const datos = pm.response.json();

      // 2 y 3. Contrato del error.
      pm.test("CP-SERV-16 | Contrato: error y permiso_requerido", function () {
          pm.expect(datos).to.include.all.keys("error", "permiso_requerido");
      });

      // 4. Regla: falta el permiso decidir y el mensaje nombra el rol auditor.
      pm.test("CP-SERV-16 | Falta el permiso decidir", function () {
          pm.expect(datos.permiso_requerido).to.eql("decidir");
          pm.expect(datos.error).to.include("auditor");
      });
    language: text/javascript
order: 7000
