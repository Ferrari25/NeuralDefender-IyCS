$kind: http-request
name: CP-SERV-12 | El observador consulta incidentes
url: "{{url_gateway}}/api/v1/incidents"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-12 | El observador consulta incidentes
      // Requisito: RF-AUT-02 (el observador consulta incidentes y auditoría)
      // Técnica: tabla de decisión (rol viewer, operación consultar)
      // Precondición: sesión de observador
      // Petición: GET /api/v1/incidents
      // Esperado: 200 con la lista de incidentes.
      // Efecto: guarda un incidente con una acción pendiente en
      // incident_id y action_id, para los casos de decisión.
      // ============================================================

      // 1. Código: el observador SÍ puede consultar.
      pm.test("CP-SERV-12 | Código 200", function () {
          pm.response.to.have.status(200);
      });

      const datos = pm.response.json();

      // 2 y 3. Contrato y tipo: hay una lista de incidentes no vacía.
      pm.test("CP-SERV-12 | Contrato: lista de incidentes", function () {
          pm.expect(datos).to.have.property("incidents");
          pm.expect(datos.incidents).to.be.an("array").that.is.not.empty;
      });

      // Se busca el primer incidente con una acción pendiente y se guardan sus
      // identificadores en el entorno.
      const incidente = datos.incidents.find(i => i.recommended_actions.some(a => a.status === "pending"));
      const accion = incidente.recommended_actions.find(a => a.status === "pending");
      pm.environment.set("incident_id", incidente.incident_id);
      pm.environment.set("action_id", accion.action_id);
    language: text/javascript
order: 2000
