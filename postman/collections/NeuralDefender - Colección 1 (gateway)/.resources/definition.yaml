$kind: collection
scripts:
  - type: http:afterResponse
    code: |-
      // Aserciones globales: se ejecutan después de CADA petición de la colección.

      // RNF-RD-01: ninguna respuesta puede tardar 2 segundos o más.
      pm.test("[Global] Tiempo de respuesta menor a 2 s (RNF-RD-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // RQ-SEC-18: los errores no pueden exponer trazas ni rutas internas del servidor.
      pm.test("[Global] Sin trazas ni rutas internas (RQ-SEC-18)", function () {
          const texto = pm.response.text();
          pm.expect(texto).to.not.match(/Traceback|File \".*\.py\"|\/home\/|site-packages/);
      });

      // Contrato: toda respuesta con cuerpo de la API /api/ tiene que ser JSON.
      if (pm.request.url.getPath().startsWith("/api/") && pm.response.code !== 204 && !pm.request.url.getPath().includes("reportes")) {
          pm.test("[Global] La API responde JSON", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });
      }
    language: text/javascript
