$kind: http-request
name: CP-SERV-22 | Intento de recorrer directorios
url: "{{url_gateway}}/api/v1/incidents/..%2f..%2fetc%2fpasswd"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-22 | Intento de recorrer directorios (path traversal)
      // Requisito: RQ-SEC-18 (los errores no exponen información interna)
      // Técnica: partición de equivalencia, partición inválida
      // Petición: GET con "..%2f" en la ruta, que intenta salir de la
      // carpeta de la aplicación y leer /etc/passwd
      // Esperado: 404 controlado, sin el contenido de ningún archivo
      // del sistema ni rutas internas
      // ============================================================

      // 1. Código: la ruta no existe, 404.
      pm.test("CP-SERV-22 | Código 404", function () {
          pm.response.to.have.status(404);
      });

      // 2 y 3. Contrato: la respuesta es un error en JSON.
      pm.test("CP-SERV-22 | Contrato: campo error de tipo texto", function () {
          pm.expect(pm.response.json().error).to.be.a("string");
      });

      // 4. Regla de seguridad: no se filtra el contenido de /etc/passwd.
      pm.test("CP-SERV-22 | No expone archivos del sistema", function () {
          pm.expect(pm.response.text()).to.not.include("root:");
      });
    language: text/javascript
order: 4000
