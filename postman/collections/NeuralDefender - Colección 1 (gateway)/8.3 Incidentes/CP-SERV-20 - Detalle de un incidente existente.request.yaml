$kind: http-request
name: CP-SERV-20 | Detalle de un incidente existente
url: "{{url_gateway}}/api/v1/incidents/{{incident_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-20 | Detalle de un incidente existente
      // Requisito: RF-API-01
      // Técnica: partición de equivalencia, partición válida
      // Precondición: incident_id guardado por CP-SERV-12
      // Petición: GET /api/v1/incidents/{{incident_id}}
      // Esperado: 200 con el incidente solicitado y sus acciones
      // ============================================================

      // 1. Código: 200.
      pm.test("CP-SERV-20 | Código 200", function () {
          pm.response.to.have.status(200);
      });

      const inc = pm.response.json();

      // 2. Contrato del incidente.
      pm.test("CP-SERV-20 | Contrato del incidente", function () {
          pm.expect(inc).to.include.all.keys("incident_id", "classification", "recommended_actions");
      });

      // 3. Tipos de datos.
      pm.test("CP-SERV-20 | Tipos de datos", function () {
          pm.expect(inc.incident_id).to.be.a("string");
          pm.expect(inc.recommended_actions).to.be.an("array");
      });

      // 4. Regla: devuelve exactamente el incidente pedido.
      pm.test("CP-SERV-20 | Es el incidente solicitado", function () {
          pm.expect(inc.incident_id).to.eql(pm.environment.get("incident_id"));
      });
    language: text/javascript
order: 2000
