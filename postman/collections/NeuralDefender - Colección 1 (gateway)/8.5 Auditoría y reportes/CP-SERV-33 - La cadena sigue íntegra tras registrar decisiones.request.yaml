$kind: http-request
name: CP-SERV-33 | La cadena sigue íntegra tras registrar decisiones
url: "{{url_gateway}}/api/v1/audit/verify"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-33 | La cadena sigue íntegra tras registrar decisiones
      // Requisito: RQ-SEC-14 (registros encadenados por hash)
      // Técnica: caja gris (compara con el valor guardado en CP-SERV-14)
      // Precondición: CP-SERV-14 guardó registros_antes; desde entonces se
      // registraron decisiones en CP-SERV-23, 26 y 39a
      // Petición: GET /api/v1/audit/verify con sesión de auditor
      // Esperado: 200 con la cadena íntegra y MÁS registros que antes
      // ============================================================

      // 1. Código: 200.
      pm.test("CP-SERV-33 | Código 200", function () {
          pm.response.to.have.status(200);
      });

      const datos = pm.response.json();

      // 2 y 3. Contrato y tipos.
      pm.test("CP-SERV-33 | Contrato y tipos", function () {
          pm.expect(datos).to.include.all.keys("chain_ok", "first_broken", "records");
          pm.expect(datos.records).to.be.a("number");
      });

      // 4a. Regla: agregar registros no rompió la cadena.
      pm.test("CP-SERV-33 | La cadena sigue íntegra", function () {
          pm.expect(datos.chain_ok).to.be.true;
          pm.expect(datos.first_broken).to.be.null;
      });

      // 4b. Regla: las decisiones nuevas se agregaron al registro.
      pm.test("CP-SERV-33 | Hay más registros que en CP-SERV-14", function () {
          pm.expect(datos.records).to.be.above(Number(pm.environment.get("registros_antes")));
      });
    language: text/javascript
order: 3000
