$kind: http-request
name: CP-SERV-31 | El historial incluye la decisión registrada
url: "{{url_gateway}}/api/v1/decisions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // CP-SERV-31 | El historial incluye la decisión registrada
      // Requisitos: RF-API-03, RF-AUD-01
      // Técnica: transición de estados, caja gris (verifica el efecto de CP-SERV-23)
      // Precondición: CP-SERV-23 ejecutado
      // Petición: GET /api/v1/decisions
      // Esperado: 200 con una lista que contiene la aprobación de CP-SERV-23
      // ============================================================

      // 1. Código: 200.
      pm.test("CP-SERV-31 | Código 200", function () {
          pm.response.to.have.status(200);
      });

      const lista = pm.response.json();

      // 2 y 3. Contrato y tipo: es una lista no vacía.
      pm.test("CP-SERV-31 | Es una lista de decisiones", function () {
          pm.expect(lista).to.be.an("array").that.is.not.empty;
      });

      // 4. Regla: la decisión de CP-SERV-23 quedó registrada en el historial.
      pm.test("CP-SERV-31 | Contiene la aprobación registrada", function () {
          const encontrada = lista.find(d => d.action_id === pm.environment.get("action_id") && d.decision === "approved");
          pm.expect(encontrada, "decisión de CP-SERV-23").to.not.be.undefined;
      });
    language: text/javascript
order: 9000
