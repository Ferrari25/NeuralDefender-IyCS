# Ruff: estilo y errores rápidos, para que pylint se dedique a la lógica.
line-length = 100
target-version = "py310"
exclude = [".devtools", ".venv", "node_modules", "__pycache__"]
# Cada microservicio es su propia raíz de imports (en su contenedor, su
# directorio y `libs/` están en el PYTHONPATH), así que los dos son first-party.
src = ["libs", "services/*"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["E501"]

[lint.per-file-ignores]
# Ningún módulo del producto necesita excepciones: desde la migración a
# microservicios, el orquestador habla HTTP con los servicios en vez de lanzar
# procesos, y la allowlist de `tests/test_no_autonomy.py` quedó vacía.
# Los tests usan assert (S101) y acceden a helpers privados a propósito.
# S603/S404: `test_auditoria_append_only.py` lanza el pipeline real para verificar
# que no pisa la auditoría. Es andamiaje de prueba, no capacidad del producto, y
# `tests/test_no_autonomy.py::test_el_andamiaje_de_pruebas_no_se_despliega`
# vigila esa frontera.
# S314: `test_iconos.py` parsea el sprite SVG del propio repositorio para verificar
# que está bien formado. No es entrada no confiable —es un archivo versionado— así
# que no justifica sumar `defusedxml` como dependencia.
"tests/**" = ["S101", "S105", "S106", "S314", "S404", "S603", "S607", "SIM117"]
