# La contraseña NO va escrita acá: Logstash resuelve ${ELASTIC_PASSWORD} del entorno
# al arrancar. No pasar los xpack.monitoring.* como variables de entorno en el compose:
# la imagen de Logstash reescribe este archivo con esos valores (así terminó la
# contraseña versionada en git).
http.host: 0.0.0.0
log.level: info
path.config: /usr/share/logstash/pipeline
path.logs: /usr/share/logstash/logs
pipeline.batch.delay: 50
pipeline.batch.size: 125
pipeline.workers: 2
queue.max_bytes: 1gb
queue.type: memory
xpack.monitoring.elasticsearch.hosts: http://elasticsearch:9200
xpack.monitoring.elasticsearch.password: "${ELASTIC_PASSWORD}"
xpack.monitoring.elasticsearch.username: elastic
xpack.monitoring.enabled: true
