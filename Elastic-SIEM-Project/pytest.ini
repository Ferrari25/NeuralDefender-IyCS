[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    bug: congela un bug conocido; DEBE fallar cuando se corrija (ver docs/10-auditoria-y-hallazgos.md)
    slow: tarda más de 5 s
filterwarnings =
    ignore::DeprecationWarning:flask.*
