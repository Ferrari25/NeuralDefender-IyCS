server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch connection settings
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${KIBANA_SYSTEM_PASSWORD}"

# SIEM specific settings
xpack.securitySolution.enabled: true
xpack.securitySolution.enableExperimental: ["alertingEventExceptions"]
xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_SAVEDOBJECTS_KEY}"

# Monitoring settings
monitoring.ui.container.elasticsearch.enabled: true

# Telemetry settings (can be disabled in production)
telemetry.enabled: false

# Logging settings
logging.root.level: info
